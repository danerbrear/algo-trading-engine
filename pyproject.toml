[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-engine"
version = "0.11.3"
description = "Options trading backtesting and trading framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "hmmlearn>=0.3.0",
    "polygon-api-client>=1.14.5",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "vollib>=1.0.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "prospector[with_pyright,with_pyroma]~=1.20",
    "pre-commit>=3.0",
    "black>=24.0",
    "tensorflow>=2.15.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["algo_trading_engine*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.pyright]
typeCheckingMode = "standard"
exclude = [
    "**/__pycache__",
    "**/.*",
    "data_cache",
    "venv",
    "logs",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]

[tool.pylint.main]
py-version = "3.10"
source-roots = ["src"]
jobs = 0
ignore-paths = [
    "^venv/.*$",
    "^build/.*$",
    "^src/.*\\.egg-info/.*$",
]

[tool.pylint."messages control"]
disable = [
    "broad-exception-caught",
    "line-too-long",
    "trailing-whitespace",
    "trailing-newlines",
    "missing-final-newline",
    "superfluous-parens",
    "wrong-import-order",
    "ungrouped-imports",
]

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-returns = 6
max-branches = 15
max-statements = 60

[tool.pylint.format]
max-line-length = 120
