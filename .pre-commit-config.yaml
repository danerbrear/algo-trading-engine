repos:
  - repo: local
    hooks:
      - id: prospector
        name: prospector
        entry: venv/bin/python -m prospector --profile=prospector-config.yaml
        language: system
        types: [python]
      - id: format
        name: format
        entry: venv/bin/python -m black .
        language: system
        pass_filenames: false
        files: \.py$
