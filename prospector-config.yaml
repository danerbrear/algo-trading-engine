output-format: yaml

ignore-paths:
  - venv
  - build
  - data_cache
  - docs
  - logs

ignore-patterns:
  - "^src/.*\\.egg-info/.*$"

pylint:
  run: true
  disable:
    - C
    - R

pycodestyle:
  run: false

pyright:
  run: true

pyroma:
  run: true

pydocstyle:
  run: false

pyflakes:
  run: false